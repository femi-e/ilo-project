[package]
name = "mem-arch"
version = "1.0.0"
edition = "2021"
description = "ILO: Cognitive memory runtime for coding agents — persistent graph memory with FTS/vector retrieval, PPR graph traversal, and Hebbian learning"

[profile.release]
opt-level = 3     # max speed
lto = "fat"       # cross-crate LTO (smaller + faster)
strip = "symbols" # strip debug symbols
codegen-units = 1 # single codegen unit for max LTO

[lib]
name = "mem_arch"
path = "src/lib.rs"

[[bin]]
name = "ilo"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
lbug = "0.18.3"

# UUID generation
uuid = { version = "1", features = ["v7", "fast-rng"] }

# Errors
thiserror = "2"


# File locking
libc = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for embeddings via mistral.rs)
reqwest = { version = "0.12", features = ["json"] }
